<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan Home Furniture</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: linear-gradient(180deg, #ff822f 0%, #ffffff 100%); min-height: 100vh; }

        /* Restored Animation */
        .card { 
            background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            overflow: hidden; animation: fadeInUp 0.8s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Navigation Style */
        nav { background: white; padding: 1rem; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav a { margin: 0 15px; text-decoration: none; color: #3e3a35; font-weight: bold; }
        nav a:hover { color: #bf9868; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; text-align: center; }
        .logo { width: 300px; margin-bottom: 0rem; }

        

        .card-image { width: 100%; height: 250px; object-fit: cover; }
        
       
        
    </style>
</head>


<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">
        <img src="plume.png" alt="Brand Logo" class="logo">
        <h1>Sublimez votre table 
            avec élégance</h1>
        <p>Vaisselle, décoration et service à café soigneusement sélectionnés pour apporter du charme à votre intérieur..</p>
        <a href="shop.html" class="buy-btn">View Collection</a>
    </div>

</body>
<div class="container">
    
    
    <h1>Our Furniture Collection</h1>
    <div class="grid">
        <div class="card">
            <img src="high.jpg" alt="Furniture" class="card-image">
            <div class="card-content"> 
            </div>
        </div>
    </div>
</div> 
</html>
